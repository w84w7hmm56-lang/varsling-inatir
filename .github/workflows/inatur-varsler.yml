
name: Inatur elgvarsler Nordland

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send testvarsel til telefonen'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: inatur-varsler
  cancel-in-progress: false

jobs:
  overvaking:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer pakker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sjekk Inatur
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test_notification }}" = "true" ]; then
            python monitor.py --test-notification
          else
            python monitor.py
          fi

      - name: Lagre status
        if: ${{ inputs.test_notification != true }}
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Oppdater Inatur-varsler [skip ci]'
              git push
            fi
          fi

      - name: Last opp feilsokingsbilde
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inatur-feilsoking
          path: inatur-feil-sok.png
          if-no-files-found: ignore
